<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ingresar — Panel Zen Skin Studio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/admin-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#07231A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Zen Admin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" novalidate>
      <h1>Zen Skin Studio</h1>
      <p class="sub">Panel administrativo — acceso solo para personal autorizado</p>

      <div id="loginMsg"></div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button class="btn" type="submit" id="loginBtn" style="width:100%">Ingresar</button>
      <p style="text-align:center; margin-top:1rem">
        <a href="#" id="forgotLink" class="muted">¿Olvidaste tu contraseña?</a>
      </p>
    </form>

    <form class="login-card hidden" id="recoverForm" novalidate style="margin-top:1rem">
      <h1 style="font-size:1.3rem">Recuperar contraseña</h1>
      <p class="sub">Te enviaremos un enlace a tu correo para elegir una contraseña nueva</p>

      <div id="recoverMsg"></div>

      <div class="field">
        <label for="recoverEmail">Correo</label>
        <input id="recoverEmail" name="email" type="email" autocomplete="username" required />
      </div>

      <button class="btn" type="submit" id="recoverBtn" style="width:100%">Enviar enlace</button>
      <p style="text-align:center; margin-top:1rem">
        <a href="#" id="backToLoginLink" class="muted">Volver a iniciar sesión</a>
      </p>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-client.js";

    const form = document.getElementById("loginForm");
    const msgEl = document.getElementById("loginMsg");
    const btn = document.getElementById("loginBtn");

    // ---- Alternar entre "Ingresar" y "Recuperar contraseña" ----
    const recoverForm = document.getElementById("recoverForm");
    const recoverMsg = document.getElementById("recoverMsg");
    const recoverBtn = document.getElementById("recoverBtn");

    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      form.classList.add("hidden");
      recoverForm.classList.remove("hidden");
    });
    document.getElementById("backToLoginLink").addEventListener("click", (e) => {
      e.preventDefault();
      recoverForm.classList.add("hidden");
      form.classList.remove("hidden");
    });

    recoverForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      recoverBtn.disabled = true;
      recoverMsg.innerHTML = "";

      const email = document.getElementById("recoverEmail").value.trim();
      const redirectTo = new URL("./reset-password.html", window.location.href).href;

      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

      if (error) {
        recoverMsg.innerHTML = `<div class="msg msg--error">No se pudo enviar el enlace: ${error.message}</div>`;
        recoverBtn.disabled = false;
        return;
      }

      recoverMsg.innerHTML = `<div class="msg msg--ok">Listo. Revisa tu correo y sigue el enlace para elegir una contraseña nueva.</div>`;
      recoverBtn.disabled = false;
    });

    function showMsg(text, type) {
      msgEl.innerHTML = `<div class="msg msg--${type}">${text}</div>`;
    }

    // Si ya hay sesión activa y válida como staff, pasa directo al dashboard.
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const { data: staff } = await supabase
        .from("staff")
        .select("id")
        .eq("id", session.user.id)
        .maybeSingle();
      if (staff) window.location.href = "./index.html";
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msgEl.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showMsg("Credenciales incorrectas o usuario no encontrado.", "error");
        btn.disabled = false;
        return;
      }

      const { data: staff, error: staffError } = await supabase
        .from("staff")
        .select("id, activo")
        .eq("id", data.user.id)
        .maybeSingle();

      if (staffError || !staff || !staff.activo) {
        showMsg("Tu usuario no tiene acceso al panel administrativo.", "error");
        await supabase.auth.signOut();
        btn.disabled = false;
        return;
      }

      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
