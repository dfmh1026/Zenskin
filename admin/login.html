<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ingresar — Panel Zen Skin Studio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" novalidate>
      <h1>Zen Skin Studio</h1>
      <p class="sub">Panel administrativo — acceso solo para personal autorizado</p>

      <div id="loginMsg"></div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button class="btn" type="submit" id="loginBtn" style="width:100%">Ingresar</button>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-client.js";

    const form = document.getElementById("loginForm");
    const msgEl = document.getElementById("loginMsg");
    const btn = document.getElementById("loginBtn");

    function showMsg(text, type) {
      msgEl.innerHTML = `<div class="msg msg--${type}">${text}</div>`;
    }

    // Si ya hay sesión activa y válida como staff, pasa directo al dashboard.
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const { data: staff } = await supabase
        .from("staff")
        .select("id")
        .eq("id", session.user.id)
        .maybeSingle();
      if (staff) window.location.href = "./index.html";
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msgEl.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showMsg("Credenciales incorrectas o usuario no encontrado.", "error");
        btn.disabled = false;
        return;
      }

      const { data: staff, error: staffError } = await supabase
        .from("staff")
        .select("id, activo")
        .eq("id", data.user.id)
        .maybeSingle();

      if (staffError || !staff || !staff.activo) {
        showMsg("Tu usuario no tiene acceso al panel administrativo.", "error");
        await supabase.auth.signOut();
        btn.disabled = false;
        return;
      }

      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
