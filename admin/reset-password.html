<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Nueva contraseña — Panel Zen Skin Studio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/admin-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#07231A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Zen Admin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="resetForm" novalidate>
      <h1>Nueva contraseña</h1>
      <p class="sub">Elige la contraseña con la que ingresarás de ahora en adelante</p>

      <div id="resetMsg"></div>

      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required />
      </div>

      <div class="field">
        <label for="password2">Confirmar contraseña</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="6" required />
      </div>

      <button class="btn" type="submit" id="resetBtn" style="width:100%">Guardar contraseña</button>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-client.js";

    const form = document.getElementById("resetForm");
    const msgEl = document.getElementById("resetMsg");
    const btn = document.getElementById("resetBtn");

    function showMsg(text, type) {
      msgEl.innerHTML = `<div class="msg msg--${type}">${text}</div>`;
    }

    // El enlace del correo de recuperación abre esta página con una sesión
    // temporal de tipo "recovery"; si no existe, el enlace ya no es válido.
    let hasRecoverySession = false;

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") hasRecoverySession = true;
    });

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) hasRecoverySession = true;
      if (!hasRecoverySession) {
        showMsg("Este enlace ya no es válido o expiró. Solicita uno nuevo desde la página de ingreso.", "error");
        form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgEl.innerHTML = "";

      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;

      if (password.length < 6) {
        showMsg("La contraseña debe tener al menos 6 caracteres.", "error");
        return;
      }
      if (password !== password2) {
        showMsg("Las contraseñas no coinciden.", "error");
        return;
      }

      btn.disabled = true;
      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        showMsg(`No se pudo guardar la contraseña: ${error.message}`, "error");
        btn.disabled = false;
        return;
      }

      showMsg("Contraseña actualizada. Redirigiendo al ingreso…", "ok");
      await supabase.auth.signOut();
      setTimeout(() => { window.location.href = "./login.html"; }, 1500);
    });
  </script>
</body>
</html>
